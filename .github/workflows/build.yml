name: Byg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Samme signeringsnøgle hver gang, så nye versioner kan installeres oven i de gamle.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: airsync-debug-keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Byg
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Omdøb APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AirTooth.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AirTooth-apk
          path: AirTooth.apk

      - name: Udgiv som release (nem download på telefonen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AirTooth build ${{ github.run_number }}
          files: AirTooth.apk
